{% load static %}<!DOCTYPE html>
<html lang="en">
<head> {% load static %}
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="Mi E-commerce en Devuan" />
    <meta name="author" content="Clodomiro" />
    <title>{% block title %} {% endblock %} | Tienda Pro</title>
    <!-- Favicon-->
    <link rel="icon" type="image/x-icon" href="{% static 'favicon.ico' %}" />
    <!-- Bootstrap icons-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
    <!-- Core theme CSS (includes Bootstrap)-->
    <link href="{% static 'css/styles.css' %}?id={{ csrf_token }}" rel="stylesheet" />
    <link href="{% static 'css/jquery.alerts.min.css' %}" rel="stylesheet" />
    <link rel="stylesheet" type="text/css" href="{% static 'fontawesome-free-5.15.4-web/css/all.css' %}" />
    {% block bloques_css %} {% endblock %}
</head>
    <body>
        <!-- Navigation-->
        <nav class="navbar navbar-expand-lg navbar-light bg-light">
            <div class="container px-4 px-lg-5">
                <a class="navbar-brand" href="{% url 'home_inicio' %}"><img src="{% static 'images/logo.png' %}">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4 d-flex align-items-center">
                        <li class="nav-item"><a class="nav-link" aria-current="page" href="{% url 'home_inicio' %}">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link" href="#!">Login</a></li>
                    </ul>
                    <form class="d-flex">
                        <button class="btn btn-outline-dark" type="submit">
                            <i class="bi-cart-fill me-1"></i>
                            Carrito
                            <span class="badge bg-dark text-white ms-1 rounded-pill">0</span>
                        </button>
                    </form>
                </div>
            </div>
        </nav>
        <!-- Header-->
        <header class="bg-dark py-5">
            <div class="container px-4 px-lg-5 my-5">
                <div class="text-center text-white">
                    <h1 class="display-4 fw-bolder">Tienda virtual</h1>
                    <p class="lead fw-normal text-white-50 mb-0">Integrada a webpay desde Django</p>
                </div>
            </div>
        </header>
        <!-- Section-->
         
        <!-- contenido-->
        {% block content %} {% endblock %}
        <!-- /contenido-->

        <!-- Footer-->
        <footer class="py-5 bg-dark">
            <div class="container"><p class="m-0 text-center text-white">Copyright &copy; Your Website 2026</p></div>
        </footer>
        <a class="whats-app" href="https://api.whatsapp.com/send?phone=+56944444444&text=https://www.mipagina.com/ %0D%0A%0D%0AHola necesito información de: " target="_blank" title="Estamos disponibles......">       
        <i class="fab fa-whatsapp my-float"></i>
        </a> 
        <script src="{% static 'js/jquery-3.6.4.min.js' %}"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="{% static 'js/jquery.alerts.min.js' %}"></script>
        <!-- Core theme JS-->
        <script src="{% static 'js/scripts.js' %}?id={{ csrf_token }}" ></script>
        {% block bloques_js %} {% endblock %}
    </body>
</html>
